<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>samotest Demo</title>
    <style>
      body { margin: 0; background: #1f1308; color: #fff7ed; font-family: Inter, system-ui, sans-serif; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 32px; }
      .demo { width: min(900px, 100%); display: grid; gap: 18px; }
      h1 { margin: 0; font-size: 44px; letter-spacing: 0; }
      p { margin: 0; color: #fed7aa; font-size: 18px; }
      .grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 18px; }
      .card { border: 1px solid #fb923c66; border-radius: 16px; background: #2d1606; padding: 22px; box-shadow: 0 24px 70px #0008; }
      .step { opacity: 0; animation: reveal 8s infinite; margin: 14px 0; font: 16px ui-monospace, monospace; }
      .step:nth-child(2) { animation-delay: 1.2s; }
      .step:nth-child(3) { animation-delay: 2.4s; }
      .step:nth-child(4) { animation-delay: 3.6s; }
      .shot { height: 150px; border-radius: 12px; background: #fed7aa; position: relative; overflow: hidden; }
      .shot::before { content: ""; position: absolute; inset: 18px; border-radius: 10px; background: #fff7ed; transform: translateX(-120%); animation: scan 8s infinite; }
      .shot::after { content: "GIF + screenshots + notes"; position: absolute; left: 24px; bottom: 24px; color: #431407; font-weight: 800; }
      @keyframes reveal { 0%, 10% { opacity: 0; transform: translateY(8px); } 18%, 82% { opacity: 1; transform: none; } 100% { opacity: 0; } }
      @keyframes scan { 0%, 20% { transform: translateX(-120%); } 45%, 80% { transform: translateX(0); } 100% { transform: translateX(120%); } }
    </style>
  </head>
  <body>
    <main>
      <section class="demo">
        <h1>samotest</h1>
        <p>Manual testing evidence generated by a CLI, ready for review comments.</p>
        <div class="grid">
          <div class="card">
            <div class="step">$ samotest record onboarding --format gif</div>
            <div class="step">✓ browser scenario captured</div>
            <div class="step">✓ manifest includes checksums</div>
            <div class="step">✓ gate report ready for samorev</div>
          </div>
          <div class="card"><div class="shot"></div></div>
        </div>
      </section>
    </main>
  </body>
</html>
